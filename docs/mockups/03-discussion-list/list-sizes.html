<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mockup 03 · Trois largeurs</title>
    <style>
      :root {
        --bg: #e9e9ee;
        --ink: #1d1d1f;
        --ink-3: #6e6e73;
        --surface: #fff;
        --line: #d2d2d7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f0f10;
          --ink: #f5f5f7;
          --ink-3: #8e8e93;
          --surface: #1c1c1e;
          --line: #38383a;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.5 system-ui,
          sans-serif;
        padding: 20px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      p {
        margin: 0 0 16px;
        color: var(--ink-3);
      }
      .row {
        display: flex;
        gap: 24px;
        align-items: flex-start;
        overflow-x: auto;
        padding-bottom: 20px;
      }
      figure {
        margin: 0;
        flex: none;
      }
      figcaption {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-3);
        margin-bottom: 8px;
      }
      figcaption small {
        font-weight: 400;
        text-transform: none;
        letter-spacing: 0;
        margin-left: 8px;
      }
      iframe {
        display: block;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--surface);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
      }
    </style>
  </head>
  <body>
    <h1>Liste des discussions, trois largeurs</h1>
    <p>
      Même page, rendue à 400, 760 et 1180 px. Faites défiler horizontalement si besoin. Le thème
      suit votre système.
    </p>
    <div class="row">
      <figure>
        <figcaption>
          400 px
          <small
            >mobile : une colonne, espaces en puces défilantes, compteur au-dessus du texte,
            pagination précédente / suivante</small
          >
        </figcaption>
        <iframe src="list.html" width="400" height="900" title="Mobile 400 px"></iframe>
      </figure>
      <figure>
        <figcaption>
          760 px
          <small>tablette : nav des espaces + liste, colonne « Cet espace » sous la liste</small>
        </figcaption>
        <iframe src="list.html" width="760" height="900" title="Tablette 760 px"></iframe>
      </figure>
      <figure>
        <figcaption>1180 px <small>desktop : trois colonnes</small></figcaption>
        <iframe src="list.html" width="1180" height="900" title="Desktop 1180 px"></iframe>
      </figure>
    </div>
  </body>
</html>
