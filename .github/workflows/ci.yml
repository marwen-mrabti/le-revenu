name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm lint
      - run: pnpm format:check
      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm turbo run type-check

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm turbo run test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-web
          path: apps/web/coverage
          if-no-files-found: ignore

  test-cms:
    name: CMS integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lerevenu
          POSTGRES_PASSWORD: lerevenu
          POSTGRES_DB: lerevenu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lerevenu -d lerevenu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: Use the CI environment file
        run: cp apps/cms/.env.ci apps/cms/.env
      - run: pnpm --filter cms test:integration
        env:
          STRAPI_TELEMETRY_DISABLED: 'true'

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, type-check, test-unit, test-cms]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm turbo run build
        env:
          STRAPI_URL: http://localhost:1337
          AUTH_COOKIE_NAME: lr_session
          REVALIDATE_SECRET: ci-only-not-a-secret

  docker-build:
    name: Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Pushed on main only; Render pulls this public image (see render.yaml, ADR-0011).
      PUSH_CMS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      CMS_IMAGE: ghcr.io/${{ github.repository_owner }}/le-revenu-cms
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub's registry
        if: env.PUSH_CMS == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the Strapi image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/cms/Dockerfile
          push: ${{ env.PUSH_CMS == 'true' }}
          tags: |
            ${{ env.CMS_IMAGE }}:latest
            ${{ env.CMS_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=cms
          cache-to: type=gha,mode=max,scope=cms
      - name: Deploy the new image on Render
        # The hook URL is a repository secret; without it the image is published and nothing else happens.
        if: env.PUSH_CMS == 'true' && env.HOOK != ''
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -fsS -o /dev/null "$HOOK" && echo "Render deploy triggered"
      - name: Build the Next.js image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
