version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      next:
        patterns:
          [
            'next',
            'react',
            'react-dom',
            '@types/react',
            '@types/react-dom',
            'eslint-config-next',
            '@next/*',
          ]
      tanstack:
        patterns: ['@tanstack/*']
      strapi:
        patterns: ['@strapi/*']
      dev-tooling:
        patterns:
          [
            'eslint*',
            'prettier*',
            'typescript*',
            'vitest*',
            '@vitest/*',
            'husky',
            'lint-staged',
            '@commitlint/*',
            'turbo',
          ]
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: docker
    directory: /apps/cms
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(docker)'
  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(docker)'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'
