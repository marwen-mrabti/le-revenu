services:
  db:
    image: postgres:16-alpine
    container_name: lerevenu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lerevenu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lerevenu}
      POSTGRES_DB: ${POSTGRES_DB:-lerevenu}
      # Second database for the Strapi integration tests
      POSTGRES_TEST_DB: ${POSTGRES_DB:-lerevenu}_test
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
